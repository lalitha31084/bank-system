version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/bank_db
    depends_on:
      - db

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bank_db
    ports:
      - "5433:5432"
    volumes:
      # This points to the seeds folder shown in your VS Code sidebar
      - ./seeds/init.sql:/docker-entrypoint-initdb.d/init.sql